# Netlify reads this from the repo root. The Astro adapter writes the static
# pages to dist/ and the on-demand /jobs route to .netlify/v1/functions/ssr,
# which Netlify picks up on its own — publish only needs to point at dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5 needs 18.17+. Pinned so a change to Netlify's default can't move
  # the build out from under us.
  NODE_VERSION = "22"

# ── Redirects ─────────────────────────────────────────────────────────────
# Site alias -> canonical domain. Forced so todasco.netlify.app stops serving
# a duplicate copy of the site even where the same file exists on both hosts.
[[redirects]]
  from = "https://todasco.netlify.app/*"
  to = "https://todasco.com/:splat"
  status = 301
  force = true

# Legacy paths from the retired Lovable site. Unforced, so any real page added
# later at one of these paths wins over the redirect.
[[redirects]]
  from = "/childrens-books"
  to = "/periodic-fables"
  status = 301

[[redirects]]
  from = "/ai-newsletter"
  to = "/newsletter"
  status = 301

[[redirects]]
  from = "/ai-movies"
  to = "/ai-at-the-movies"
  status = 301

[[redirects]]
  from = "/research-patents"
  to = "/research"
  status = 301

[[redirects]]
  from = "/socials"
  to = "/about"
  status = 301

[[redirects]]
  from = "/mikesjobs"
  to = "/jobs"
  status = 301

# The old site had ~30 /media/<topic> pages; the new site has one /media page.
[[redirects]]
  from = "/media/*"
  to = "/media"
  status = 301

# ── Security headers ──────────────────────────────────────────────────────
# Netlify served only HSTS by default. The CSP is built from what the site
# actually loads: Google Fonts (stylesheet + font files), the Patent Leaderboard
# iframe on /patents, and the Substack subscribe form. Everything else is
# same-origin. Outbound <a href> links need no allowance.
#
# script-src needs 'unsafe-inline' because Astro inlines the featured-article
# rotation script into newsletter.html rather than emitting a file. A hash would
# be tighter but changes every time that script does, and would fail silently.
# The site takes no user input — no search, no comments, no query-string
# rendering — so there is no injection path for that to widen.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.patentleaderboard.com; form-action 'self' https://todasco.substack.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
